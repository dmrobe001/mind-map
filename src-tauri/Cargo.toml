[package]
name = "mind-map"
version = "0.1.0"
description = "A mind map editor for things that refuse to live in one folder"
authors = ["dmrobe001"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The _lib suffix keeps the desktop binary and the mobile library from
# colliding on Windows, where a bin and a lib cannot share a name.
name = "mind_map_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
